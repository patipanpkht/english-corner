<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Corner - Borrowing System</title>
  
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts for modern look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;750;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <!-- Root container for React app -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const HARDCODED_API_URL = 'https://script.google.com/macros/s/AKfycbyhRCkG8jR6_FRcbirBTrtnh75U2xZf8STlYxkt4k9G1l6tTq4wbGJkIAMwTRiN32ssSA/exec';

    // Offline Fallback Data
    const localDefaultItems = [
      { id: 'B001', title: "Harry Potter and the Philosopher's Stone", type: 'book', category: 'Fiction', status: 'available', description: 'A world-famous fantasy novel about a young wizard.' },
      { id: 'B002', title: 'Atomic Habits', type: 'book', category: 'Self-Improvement', status: 'available', description: 'An easy & proven way to build good habits & break bad ones.' },
      { id: 'B003', title: 'Python Programming for Beginners', type: 'book', category: 'Academic', status: 'borrowed', description: 'Step-by-step introduction to programming with Python.' },
      { id: 'G001', title: 'Catan (The Settlers of Catan)', type: 'boardgame', category: 'Strategy', status: 'available', description: 'Collect resources and build settlements on the island of Catan.' },
      { id: 'G002', title: 'The Resistance: Avalon', type: 'boardgame', category: 'Party/Bluffing', status: 'available', description: 'Unmask the traitors among King Arthur\'s loyal knights.' },
      { id: 'G003', title: 'Dixit', type: 'boardgame', category: 'Party/Creative', status: 'borrowed', description: 'A beautifully illustrated storytelling and guessing game.' }
    ];

    const localDefaultLogs = [
      { id: 'T-1001', studentId: '650101', studentName: 'John Smith', classroom: 'Grade 11/1', itemId: 'B003', itemTitle: 'Python Programming for Beginners', borrowDate: '2026-06-01', status: 'borrowed' },
      { id: 'T-1002', studentId: '650102', studentName: 'Emma Watson', classroom: 'Grade 11/2', itemId: 'G003', itemTitle: 'Dixit', borrowDate: '2026-06-05', status: 'borrowed' }
    ];

    function App() {
      const [items, setItems] = useState(localDefaultItems);
      const [logs, setLogs] = useState(localDefaultLogs);
      const [activeTab, setActiveTab] = useState('student');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterType, setFilterType] = useState('all');
      
      const [adminSubTab, setAdminSubTab] = useState('inventory');
      
      const [apiUrl, setApiUrl] = useState(() => {
        const savedUrl = localStorage.getItem('ec_api_url');
        return HARDCODED_API_URL || savedUrl || '';
      });
      const [isLoading, setIsLoading] = useState(false);

      const [adminCreds, setAdminCreds] = useState(() => {
        const saved = localStorage.getItem('ec_admin_creds');
        return saved ? JSON.parse(saved) : { username: 'admin', password: '123456' };
      });

      const [studentForm, setStudentForm] = useState({
        studentId: '',
        firstName: '',
        lastName: '',
        classroom: '',
        itemId: ''
      });
      
      const [receipt, setReceipt] = useState(null);
      const [errorMessage, setErrorMessage] = useState('');

      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [adminUsername, setAdminUsername] = useState('');
      const [adminPassword, setAdminPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      
      const [newItem, setNewItem] = useState({
        id: '',
        title: '',
        type: 'book',
        category: '',
        description: ''
      });
      const [adminSuccessMsg, setAdminSuccessMsg] = useState('');

      const [apiInputUrl, setApiInputUrl] = useState(apiUrl);
      const [passwordForm, setPasswordForm] = useState({
        currentPassword: '',
        newPassword: '',
        confirmPassword: ''
      });
      const [passwordError, setPasswordError] = useState('');
      const [passwordSuccess, setPasswordSuccess] = useState('');

      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => {
          setToast({ show: false, message: '', type: 'success' });
        }, 3000);
      };

      const syncWithGoogleSheets = async (targetUrl = apiUrl) => {
        if (!targetUrl) return;
        setIsLoading(true);
        try {
          const response = await fetch(targetUrl);
          if (!response.ok) throw new Error('Network response not ok');
          const data = await response.json();
          if (data.items) setItems(data.items);
          if (data.logs) setLogs(data.logs);
          showToast('Database synced with Google Sheets successfully!', 'success');
        } catch (err) {
          console.error(err);
          showToast('Failed to fetch data from Google Sheets. Operating in local-mode.', 'error');
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        if (apiUrl) {
          syncWithGoogleSheets();
        }
      }, [apiUrl]);

      const handleBorrowSubmit = async (e) => {
        e.preventDefault();
        setErrorMessage('');

        const targetItem = items.find(i => i.id.toUpperCase() === studentForm.itemId.toUpperCase());

        if (!studentForm.studentId || !studentForm.firstName || !studentForm.lastName || !studentForm.classroom || !studentForm.itemId) {
          setErrorMessage('Please fill in all the required fields.');
          return;
        }

        if (!targetItem) {
          setErrorMessage('The item ID was not found in our database.');
          return;
        }

        if (targetItem.status !== 'available') {
          setErrorMessage('Sorry, this item is currently borrowed or unavailable.');
          return;
        }

        const transactionId = `T-${Math.floor(1000 + Math.random() * 9000)}`;
        const today = new Date().toISOString().split('T')[0];
        const dueDate = new Date();
        dueDate.setDate(dueDate.getDate() + 7);
        const dueDateStr = dueDate.toISOString().split('T')[0];

        const updatedItems = items.map(item => {
          if (item.id === targetItem.id) {
            return { ...item, status: 'borrowed' };
          }
          return item;
        });

        const newLog = {
          id: transactionId,
          studentId: studentForm.studentId,
          studentName: `${studentForm.firstName} ${studentForm.lastName}`,
          classroom: studentForm.classroom,
          itemId: targetItem.id,
          itemTitle: targetItem.title,
          borrowDate: today,
          status: 'borrowed'
        };

        if (apiUrl) {
          setIsLoading(true);
          try {
            const response = await fetch(apiUrl, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'borrow',
                id: transactionId,
                studentId: studentForm.studentId,
                studentName: `${studentForm.firstName} ${studentForm.lastName}`,
                classroom: studentForm.classroom,
                itemId: targetItem.id,
                itemTitle: targetItem.title,
                borrowDate: today
              })
            });
            
            const resJson = await response.json();
            if (resJson.success) {
              setItems(updatedItems);
              setLogs([newLog, ...logs]);
              setReceipt({
                id: transactionId,
                studentId: studentForm.studentId,
                studentName: `${studentForm.firstName} ${studentForm.lastName}`,
                classroom: studentForm.classroom,
                itemId: targetItem.id,
                itemTitle: targetItem.title,
                itemType: targetItem.type === 'book' ? 'Book' : 'Board Game',
                borrowDate: today,
                dueDate: dueDateStr
              });
              setStudentForm({ studentId: '', firstName: '', lastName: '', classroom: '', itemId: '' });
              showToast('Borrowing recorded on Google Sheets successfully!', 'success');
            } else {
              setErrorMessage('Database error: ' + resJson.error);
            }
          } catch (err) {
            console.error(err);
            setErrorMessage('Failed to connect to cloud database. Try again or check your URL.');
          } finally {
            setIsLoading(false);
          }
        } else {
          setItems(updatedItems);
          setLogs([newLog, ...logs]);
          setReceipt({
            id: transactionId,
            studentId: studentForm.studentId,
            studentName: `${studentForm.firstName} ${studentForm.lastName}`,
            classroom: studentForm.classroom,
            itemId: targetItem.id,
            itemTitle: targetItem.title,
            itemType: targetItem.type === 'book' ? 'Book' : 'Board Game',
            borrowDate: today,
            dueDate: dueDateStr
          });
          setStudentForm({ studentId: '', firstName: '', lastName: '', classroom: '', itemId: '' });
          showToast('Transaction recorded locally! (Offline Mode)', 'success');
        }
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        setLoginError('');
        if (adminUsername === adminCreds.username && adminPassword === adminCreds.password) {
          setIsAdminLoggedIn(true);
          setAdminUsername('');
          setAdminPassword('');
          showToast('Logged in successfully. Welcome, Teacher!', 'success');
        } else {
          setLoginError('Invalid username or password. Please try again.');
        }
      };

      const handleAdminLogout = () => {
        setIsAdminLoggedIn(false);
        showToast('Logged out of Admin Portal.');
      };

      const handleReturnItem = async (logId, itemId) => {
        const todayStr = new Date().toISOString().split('T')[0];

        const updatedItems = items.map(item => {
          if (item.id === itemId) return { ...item, status: 'available' };
          return item;
        });

        const updatedLogs = logs.map(log => {
          if (log.id === logId) return { ...log, status: 'returned', returnDate: todayStr };
          return log;
        });

        if (apiUrl) {
          setIsLoading(true);
          try {
            const response = await fetch(apiUrl, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'return',
                logId: logId,
                itemId: itemId,
                returnDate: todayStr
              })
            });

            const resJson = await response.json();
            if (resJson.success) {
              setItems(updatedItems);
              setLogs(updatedLogs);
              showToast('Return recorded on Google Sheets successfully!', 'success');
            } else {
              showToast('Database error: ' + resJson.error, 'error');
            }
          } catch (err) {
            console.error(err);
            showToast('Connection to Google Sheets failed. Item marked offline only.', 'error');
          } finally {
            setIsLoading(false);
          }
        } else {
          setItems(updatedItems);
          setLogs(updatedLogs);
          showToast('Item successfully marked as returned locally.');
        }
      };

      const handleAddItem = async (e) => {
        e.preventDefault();
        setAdminSuccessMsg('');

        if (!newItem.id || !newItem.title || !newItem.category) {
          showToast('Please complete all required fields.', 'error');
          return;
        }

        if (items.some(item => item.id.toUpperCase() === newItem.id.toUpperCase())) {
          showToast('This item ID already exists. Please use a unique ID.', 'error');
          return;
        }

        const itemToAdd = {
          ...newItem,
          id: newItem.id.toUpperCase(),
          status: 'available'
        };

        if (apiUrl) {
          setIsLoading(true);
          try {
            const response = await fetch(apiUrl, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({
                action: 'add_item',
                ...itemToAdd
              })
            });

            const resJson = await response.json();
            if (resJson.success) {
              setItems([...items, itemToAdd]);
              setAdminSuccessMsg(`Successfully published "${newItem.title}" to Google Sheets!`);
              setNewItem({ id: '', title: '', type: 'book', category: '', description: '' });
              showToast('New asset uploaded to cloud!', 'success');
            } else {
              showToast('Database error: ' + resJson.error, 'error');
            }
          } catch (err) {
            console.error(err);
            showToast('Connection failed. Item was not saved to Google Sheets.', 'error');
          } finally {
            setIsLoading(false);
          }
        } else {
          setItems([...items, itemToAdd]);
          setAdminSuccessMsg(`Successfully added "${newItem.title}" locally!`);
          setNewItem({ id: '', title: '', type: 'book', category: '', description: '' });
          showToast('Item saved locally! (Offline Mode)', 'success');
        }
      };

      const handleSaveApiUrl = (e) => {
        e.preventDefault();
        localStorage.setItem('ec_api_url', apiInputUrl);
        setApiUrl(apiInputUrl);
        showToast('Database connection settings updated!', 'success');
        if (apiInputUrl) {
          syncWithGoogleSheets(apiInputUrl);
        } else {
          setItems(localDefaultItems);
          setLogs(localDefaultLogs);
          showToast('Reverted to Offline default data', 'success');
        }
      };

      const handleChangePassword = (e) => {
        e.preventDefault();
        setPasswordError('');
        setPasswordSuccess('');

        if (passwordForm.currentPassword !== adminCreds.password) {
          setPasswordError('Current password is incorrect. Please try again.');
          return;
        }

        if (passwordForm.newPassword.length < 4) {
          setPasswordError('The new password must be at least 4 characters long.');
          return;
        }

        if (passwordForm.newPassword !== passwordForm.confirmPassword) {
          setPasswordError('New passwords do not match. Please re-enter.');
          return;
        }

        const updatedCreds = {
          ...adminCreds,
          password: passwordForm.newPassword
        };

        setAdminCreds(updatedCreds);
        localStorage.setItem('ec_admin_creds', JSON.stringify(updatedCreds));
        setPasswordSuccess('Password successfully updated!');
        showToast('Admin password updated successfully!');

        setPasswordForm({ currentPassword: '', newPassword: '', confirmPassword: '' });
        setTimeout(() => setPasswordSuccess(''), 4000);
      };

      const filteredItems = items.filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              item.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              item.category.toLowerCase().includes(searchQuery.toLowerCase());
        
        if (filterType === 'all') return matchesSearch;
        return item.type === filterType && matchesSearch;
      });

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            {/* Header */}
            <header className="bg-gradient-to-r from-indigo-700 via-indigo-800 to-slate-900 text-white shadow-md">
              <div className="max-w-7xl mx-auto px-4 py-6 md:py-8 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
                <div className="flex items-center space-x-3">
                  <div className="bg-white/10 p-2.5 rounded-2xl backdrop-blur-sm border border-white/20">
                    <svg className="w-8 h-8 text-indigo-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight">English Corner</h1>
                      <span className={`text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-md border ${apiUrl ? 'bg-emerald-600/30 text-emerald-200 border-emerald-500/30' : 'bg-slate-700 text-slate-300 border-slate-600'}`}>
                        {apiUrl ? '🟢 Cloud Online' : '🟡 Offline Mode'}
                      </span>
                    </div>
                    <p className="text-indigo-200 text-xs md:text-sm mt-0.5">Smart books & board games borrowing system for students</p>
                  </div>
                </div>
                
                <div className="bg-slate-900/50 p-1.5 rounded-2xl flex border border-white/10">
                  <button
                    onClick={() => setActiveTab('student')}
                    className={`flex items-center space-x-2 px-5 py-2.5 rounded-xl font-medium text-sm transition-all duration-200 ${activeTab === 'student' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:text-white hover:bg-white/5'}`}
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222" /></svg>
                    <span>For Students</span>
                  </button>
                  <button
                    onClick={() => setActiveTab('admin')}
                    className={`flex items-center space-x-2 px-5 py-2.5 rounded-xl font-medium text-sm transition-all duration-200 ${activeTab === 'admin' ? 'bg-amber-600 text-white shadow-md' : 'text-slate-300 hover:text-white hover:bg-white/5'}`}
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                    <span>Teacher Portal</span>
                  </button>
                </div>
              </div>
            </header>

            {/* Main Content Area */}
            <main className="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
              {activeTab === 'student' && (
                <div className="space-y-8">
                  <div className="bg-gradient-to-br from-indigo-50 to-indigo-100 rounded-3xl p-6 md:p-8 border border-indigo-200 flex flex-col md:flex-row items-center justify-between gap-6">
                    <div className="space-y-2">
                      <span className="bg-indigo-200 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Welcome Students</span>
                      <h2 className="text-2xl md:text-3xl font-extrabold text-indigo-900">Find your favorite books and board games</h2>
                      <p className="text-indigo-700 max-w-xl text-sm md:text-base">Explore academic books or entertaining board games. Check if the item is "Available", click to auto-fill the code, and submit the form to request a loan!</p>
                    </div>
                    <div className="flex gap-4">
                      <div className="bg-white p-4 rounded-2xl shadow-sm text-center border border-indigo-100 min-w-[110px]">
                        <p className="text-3xl font-black text-indigo-600">{items.filter(i => i.status === 'available').length}</p>
                        <p className="text-xs font-semibold text-slate-500 mt-1">Available</p>
                      </div>
                      <div className="bg-white p-4 rounded-2xl shadow-sm text-center border border-indigo-100 min-w-[110px]">
                        <p className="text-3xl font-black text-amber-600">{items.filter(i => i.status === 'borrowed').length}</p>
                        <p className="text-xs font-semibold text-slate-500 mt-1">Borrowed</p>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div className="lg:col-span-2 space-y-6">
                      <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                          <h3 className="text-lg font-bold text-slate-800 flex items-center space-x-2">
                            <svg className="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>
                            <span>Media Library Catalog</span>
                          </h3>

                          <div className="inline-flex bg-slate-100 p-1 rounded-xl">
                            <button onClick={() => setFilterType('all')} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${filterType === 'all' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>All Items</button>
                            <button onClick={() => setFilterType('book')} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${filterType === 'book' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>Books</button>
                            <button onClick={() => setFilterType('boardgame')} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all ${filterType === 'boardgame' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>Board Games</button>
                          </div>
                        </div>

                        <div className="relative mb-6">
                          <span className="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none">
                            <svg className="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                          </span>
                          <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Search by title, ID (e.g. B001), or category..." className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
                        </div>

                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-sm text-slate-600">
                            <thead className="bg-slate-50 text-slate-700 text-xs uppercase tracking-wider border-b border-slate-100">
                              <tr>
                                <th className="px-4 py-3 font-semibold rounded-l-lg">ID</th>
                                <th className="px-4 py-3 font-semibold">Title & Description</th>
                                <th className="px-4 py-3 font-semibold">Type</th>
                                <th className="px-4 py-3 font-semibold">Category</th>
                                <th className="px-4 py-3 font-semibold rounded-r-lg text-center">Status</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {filteredItems.length > 0 ? (
                                filteredItems.map((item) => (
                                  <tr key={item.id} className="hover:bg-slate-50/50 transition-colors">
                                    <td className="px-4 py-4"><span className="font-mono bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded-md font-bold border border-slate-200">{item.id}</span></td>
                                    <td className="px-4 py-4">
                                      <div className="font-semibold text-slate-800 text-sm">{item.title}</div>
                                      <div className="text-xs text-slate-400 mt-0.5 line-clamp-1">{item.description}</div>
                                    </td>
                                    <td className="px-4 py-4 text-xs">
                                      {item.type === 'book' ? <span className="inline-flex items-center text-teal-700 bg-teal-50 border border-teal-100 px-2.5 py-0.5 rounded-full font-medium">Book</span> : <span className="inline-flex items-center text-purple-700 bg-purple-50 border border-purple-100 px-2.5 py-0.5 rounded-full font-medium">Board Game</span>}
                                    </td>
                                    <td className="px-4 py-4 text-xs text-slate-500">{item.category}</td>

                              <div>
                                <label className="block text-[10px] font-bold text-slate-600 mb-1">Control Code <span className="text-rose-500">*</span></label>
                                <input type="text" required value={newItem.id} onChange={(e) => setNewItem({ ...newItem, id: e.target.value })} placeholder="e.g. B004 or G004" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500 font-mono font-bold" />
                              </div>
                            </div>
                            <div>
                              <label className="block text-[10px] font-bold text-slate-600 mb-1">Title <span className="text-rose-500">*</span></label>
                              <input type="text" required value={newItem.title} onChange={(e) => setNewItem({ ...newItem, title: e.target.value })} placeholder="e.g. Monopoly" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500" />
                            </div>
                            <div>
                              <label className="block text-[10px] font-bold text-slate-600 mb-1">Category <span className="text-rose-500">*</span></label>
                              <input type="text" required value={newItem.category} onChange={(e) => setNewItem({ ...newItem, category: e.target.value })} placeholder="e.g. Finance" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500" />
                            </div>
                            <div>
                              <label className="block text-[10px] font-bold text-slate-600 mb-1">Brief Description</label>
                              <textarea value={newItem.description} onChange={(e) => setNewItem({ ...newItem, description: e.target.value })} placeholder="Synopsis..." rows="3" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500" />
                            </div>
                            <button type="submit" className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition-all flex items-center justify-center space-x-1 cursor-pointer"><span>Publish Asset to Catalog</span></button>
                          </form>
                        </div>
                      )}

                      {adminSubTab === 'settings' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 animate-in fade-in duration-200">
                          {/* Cloud Connection URL settings */}
                          <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm h-fit">
                            <h3 className="text-md font-bold text-slate-800 flex items-center space-x-1.5 pb-4 mb-4 border-b border-slate-100"><svg className="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" /></svg><span>Google Sheets Connection</span></h3>
                            <p className="text-[12px] text-slate-500 mb-4">Paste your Google Apps Script Web App URL below to link this system to your Google Sheet database.</p>
                            <form onSubmit={handleSaveApiUrl} className="space-y-4">
                              <div>
                                <label className="block text-[10px] font-bold text-slate-500 mb-1.5 uppercase tracking-wider">GOOGLE WEB APP URL</label>
                                <input type="url" value={apiInputUrl} onChange={(e) => setApiInputUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono text-slate-700" />
                              </div>
                              <div className="flex gap-2">
                                <button type="submit" className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition-colors cursor-pointer shadow-sm">Connect & Save URL</button>
                                {apiUrl && <button type="button" onClick={() => { setApiInputUrl(''); localStorage.removeItem('ec_api_url'); setApiUrl(''); setItems(localDefaultItems); setLogs(localDefaultLogs); showToast('Connection removed.', 'success'); }} className="bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-500 px-3 py-2 rounded-xl text-xs transition-colors cursor-pointer border border-slate-200">Disconnect</button>}
                              </div>
                            </form>
                          </div>

                          {/* Password Settings */}
                          <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm h-fit">
                            <h3 className="text-md font-bold text-slate-800 flex items-center space-x-1.5 pb-4 mb-4 border-b border-slate-100"><svg className="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg><span>Admin Security Settings</span></h3>
                            {passwordError && <div className="bg-rose-50 border border-rose-200 text-rose-700 p-3 rounded-xl text-xs mb-4"><span>{passwordError}</span></div>}
                            {passwordSuccess && <div className="bg-emerald-50 border border-emerald-200 text-emerald-700 p-3 rounded-xl text-xs mb-4"><span>{passwordSuccess}</span></div>}

                            <form onSubmit={handleChangePassword} className="space-y-4">
                              <div><label className="block text-[10px] font-bold text-slate-600 mb-1">Current Password</label><input type="password" required value={passwordForm.currentPassword} onChange={(e) => setPasswordForm({ ...passwordForm, currentPassword: e.target.value })} placeholder="Current password" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500" /></div>
                              <div><label className="block text-[10px] font-bold text-slate-600 mb-1">New Password</label><input type="password" required value={passwordForm.newPassword} onChange={(e) => setPasswordForm({ ...passwordForm, newPassword: e.target.value })} placeholder="New password" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500" /></div>
                              <div><label className="block text-[10px] font-bold text-slate-600 mb-1">Confirm New Password</label><input type="password" required value={passwordForm.confirmPassword} onChange={(e) => setPasswordForm({ ...passwordForm, confirmPassword: e.target.value })} placeholder="Confirm new password" className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500" /></div>
                              <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs transition-all flex items-center justify-center space-x-1 cursor-pointer shadow-md"><span>Save New Password</span></button>
                            </form>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}
            </main>
          </div>

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 mt-12">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs space-y-2">
              <p className="font-semibold text-slate-300">© 2026 English Corner Borrowing System.</p>
              <p>Sparking creative thinking and lifelong learning through books, collaboration, and educational board games.</p>
              <p className="text-slate-500">Developed for English Corner at Foreign Languages Department, Yothinburana School</p>
              <p className="text-[10px] text-slate-600 pt-3 block font-mono">Developed by Patipan Padkhuntod</p>
            </div>
          </footer>
        </div>
      );
    }

    // Initialize and Mount React Application to DOM
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
